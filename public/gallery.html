<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sprite gallery (dev)</title>
<style>body{margin:0;background:#4f7f38;font:12px sans-serif;color:#fff}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="js/data.js"></script>
<script src="js/art-core.js"></script>
<script src="js/art-buildings-a.js"></script>
<script src="js/art-buildings-b.js"></script>
<script>
const K = window.KOE, A = K.art;
const q = new URLSearchParams(location.search);
A.setView(q.get('view') || 'balanced');
const only = q.get('only') ? q.get('only').split(',') : null;
const tiers = (q.get('tiers') || '1,2,3,4').split(',').map(Number);
const types = Object.keys(A.painters).filter(t => !only || only.includes(t));
const cv = document.getElementById('c'), g = cv.getContext('2d');
const Z = +(q.get('z') || 1);
const cellW = 230 * Z, cellH = 300 * Z;
cv.width = cellW * tiers.length; cv.height = cellH * types.length + 10;
cv.style.width = cv.width + 'px';
g.fillStyle = '#5a8a40'; g.fillRect(0, 0, cv.width, cv.height);
const t0 = performance.now();
types.forEach((type, r) => {
  tiers.forEach((tier, c) => {
    const variants = type === 'wall' ? [q.get('mask') ? +q.get('mask') : 15] : [0];
    const sp = A.getSprite(type, tier, variants[0]);
    const x = c * cellW + cellW / 2, y = r * cellH + 215 * Z;
    g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); const hw = K.data.CFG.tileW / 2 * Z * K.data.BLD[type].size, hh = K.data.CFG.tileH / 2 * Z * K.data.BLD[type].size; g.moveTo(x, y - hh); g.lineTo(x + hw, y); g.lineTo(x, y + hh); g.lineTo(x - hw, y); g.fill();
    g.save(); g.translate(x, y); g.scale(Z, Z); A.drawSprite(g, sp, 0, 0); g.restore();
    g.fillStyle = '#fff'; g.fillText(type + ' t' + tier, c * cellW + 6, r * cellH + 14);
  });
});
document.title = 'done ' + Math.round(performance.now() - t0) + 'ms';
</script></body></html>
